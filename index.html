        function getIconForType(type) {
            switch(type) {
                case 'food': return '🍽️';
                case 'coffee': return '☕';
                case 'activity': return '🌟';
                case 'info': return '💡';
                default: return '📍';
            }
        }

        function setTab(tabId) {
            activeTab = tabId;
            renderTabs();
            renderContent();
            
            // 觸發動畫
            const contentDiv = document.getElementById('app-content');
            contentDiv.classList.remove('fade-in');
            void contentDiv.offsetWidth; // 觸發重繪
            contentDiv.classList.add('fade-in');
        }

        function renderFlights() {
            const container = document.getElementById('flight-container');
            container.innerHTML = flightInfo.map(flight => `
                <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 flex items-start space-x-4">
                    <div class="bg-teal-100 p-2 rounded-full text-teal-700 text-xl flex items-center justify-center w-10 h-10 flex-shrink-0">✈️</div>
                    <div>
                        <h3 class="font-bold text-base md:text-lg text-slate-800">${flight.from} <span class="text-sm md:text-base font-normal text-slate-500">(${flight.airline})</span></h3>
                        <div class="mt-1.5 text-sm md:text-base text-slate-600 space-y-1">
                            <p class="flex items-center"><span class="mr-1.5 text-slate-400">🕒</span> ${flight.depart}</p>
                            <p class="flex items-center"><span class="mr-1.5 text-slate-400">🕒</span> ${flight.return}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Open-Meteo API 天氣狀態碼對應表
        const weatherCodeMap = {
            0: { icon: '☀️', desc: '晴朗' },
            1: { icon: '🌤️', desc: '晴時多雲' },
            2: { icon: '⛅', desc: '多雲' },
            3: { icon: '☁️', desc: '陰天' },
            45: { icon: '🌫️', desc: '霧' },
            48: { icon: '🌫️', desc: '霧' },
            51: { icon: '🌧️', desc: '微雨' },
            53: { icon: '🌧️', desc: '微雨' },
            55: { icon: '🌧️', desc: '微雨' },
            61: { icon: '🌧️', desc: '陣雨' },
            63: { icon: '🌧️', desc: '陣雨' },
            65: { icon: '🌧️', desc: '大雨' },
            71: { icon: '❄️', desc: '雪' },
            73: { icon: '❄️', desc: '雪' },
            75: { icon: '❄️', desc: '雪' },
            80: { icon: '🌦️', desc: '陣雨' },
            81: { icon: '🌦️', desc: '陣雨' },
            82: { icon: '🌧️', desc: '狂風暴雨' },
            95: { icon: '⛈️', desc: '雷陣雨' },
            96: { icon: '⛈️', desc: '雷陣雨' },
            99: { icon: '⛈️', desc: '雷陣雨' },
        };

        // 渲染天氣卡片框架
        function renderWeatherCards(cardsHtml) {
            const container = document.getElementById('weather-container');
            container.innerHTML = `
                <div class="bg-white rounded-2xl shadow-sm border-t-4 border-teal-500 p-5 md:p-6">
                    <div class="flex items-center space-x-2 mb-4">
                        <span class="text-2xl md:text-3xl">🌤️</span>
                        <h2 class="text-lg md:text-xl font-extrabold text-teal-800">曼谷即時天氣預報</h2>
                    </div>
                    <div class="grid grid-cols-3 lg:grid-cols-6 gap-3">
                        ${cardsHtml}
                    </div>
                    <div class="text-right mt-4">
                        <a href="https://www.tmd.go.th/en" target="_blank" rel="noopener noreferrer" class="text-xs md:text-sm text-blue-600 hover:text-blue-800 font-medium inline-flex items-center transition-colors">
                            🔗 點此查看泰國氣象局即時預報
                        </a>
                    </div>
                </div>
            `;
        }

        async function fetchWeatherData() {
            try {
                // 呼叫 Open-Meteo API 取得曼谷預報 (經緯度 13.75, 100.5167)
                // 若超出14天可能無法取得，預防性改用指定日期期間
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=13.75&longitude=100.5167&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Asia%2FBangkok&forecast_days=6');
                if (!res.ok) throw new Error('Network response was not ok');
                
                const data = await res.json();
                const daily = data.daily;
                let weatherCards = '';

                for (let i = 0; i < 6; i++) {
                    const maxT = Math.round(daily.temperature_2m_max[i]);
                    const minT = Math.round(daily.temperature_2m_min[i]);
                    const info = weatherCodeMap[daily.weathercode[i]] || { icon: '🌤️', desc: '多雲時晴' };

                    // 確保日期標示必定為 9/19 - 9/24
                    weatherCards += `
                        <div class="bg-teal-50/70 rounded-xl p-3 flex flex-col items-center justify-center border border-teal-100 shadow-sm">
                            <div class="text-3xl mb-1">${info.icon}</div>
                            <div class="text-xs md:text-sm text-slate-500 font-bold mb-1">DAY ${i + 1} <span class="font-medium text-[10px] md:text-xs">(${tripDates[i]})</span></div>
                            <div class="text-sm md:text-base font-extrabold text-slate-800 mb-1 whitespace-nowrap">${info.desc}</div>
                            <div class="text-xs md:text-sm font-bold text-teal-700">${maxT}° / ${minT}°</div>
                        </div>
                    `;
                }

                renderWeatherCards(weatherCards);

            } catch (e) {
                // 即使連線失敗，也會顯示美美的備用資料（不再顯示紅字警告）
                let fallbackCards = fallbackWeatherData.map(w => `
                    <div class="bg-teal-50/70 rounded-xl p-3 flex flex-col items-center justify-center border border-teal-100 shadow-sm">
                        <div class="text-3xl mb-1">${w.icon}</div>
                        <div class="text-xs md:text-sm text-slate-500 font-bold mb-1">${w.day} <span class="font-medium text-[10px] md:text-xs">(${w.date})</span></div>
                        <div class="text-sm md:text-base font-extrabold text-slate-800 mb-1 whitespace-nowrap">${w.desc}</div>
                        <div class="text-xs md:text-sm font-bold text-teal-700">${w.temp}</div>
                    </div>
                `).join('');
                
                renderWeatherCards(fallbackCards);
            }
        }

        function renderTabs() {
            const container = document.getElementById('tabs-container');
            container.innerHTML = tabs.map(tab => `
                <button onclick="setTab('${tab.id}')"
                    class="flex flex-1 min-w-[100px] items-center justify-center px-3 py-2 rounded-xl font-bold text-sm md:text-base transition-all duration-200 ${
                        activeTab === tab.id
                        ? 'bg-teal-600 text-white shadow-md transform scale-105'
                        : 'bg-transparent text-slate-600 hover:bg-teal-50 hover:text-teal-700'
                    }">
                    <span class="mr-1.5 text-lg">${tab.icon}</span>
                    ${tab.label}
                </button>
            `).join('');
        }

        function renderItinerary() {
            return `<div class="space-y-6">
                ${itineraryData.map(day => `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                        <div class="bg-teal-600 px-4 py-3 text-white flex items-center justify-between">
                            <h3 class="font-bold text-lg md:text-xl">${day.day} - ${day.title}</h3>
                        </div>
                        <div class="p-4 md:p-5 space-y-4">
                            <div class="space-y-3">
                                ${day.locations.map(loc => {
                                    let nameHtml = `<p class="text-slate-800 font-bold text-base md:text-lg leading-snug">${loc.name}</p>`;
                                    if (loc.link) {
                                        nameHtml = `<a href="${loc.link}" target="_blank" rel="noopener noreferrer" class="text-blue-800 underline font-bold text-base md:text-lg leading-snug hover:text-blue-600 transition-colors block">${loc.name}</a>`;
                                    }
                                    
                                    let imageHtml = '';
                                    if (loc.image) {
                                        imageHtml = `
                                            <div class="ml-3 md:ml-4 flex-shrink-0">
                                                <img src="${loc.image}" onerror="this.style.display='none'" alt="${loc.name}" class="w-20 h-20 md:w-28 md:h-28 object-cover rounded-lg border border-slate-200 shadow-sm" />
                                            </div>
                                        `;
                                    }

                                    return `
                                    <div class="flex items-center bg-slate-50 p-3 md:p-4 rounded-xl border border-slate-100 shadow-sm">
                                        <div class="text-2xl md:text-3xl leading-none self-start mt-0.5 mr-3">${getIconForType(loc.type)}</div>
                                        <div class="flex-1 break-words whitespace-normal">
                                            ${nameHtml}
                                        </div>
                                        ${imageHtml}
                                    </div>
                                    `;
                                }).join('')}
                            </div>
                            
                            <div class="pt-4 border-t border-slate-200 grid grid-cols-1 gap-4 text-sm md:text-base">
                                <div class="flex items-start text-slate-600 bg-teal-50 p-3 md:p-4 rounded-xl">
                                    <span class="text-xl md:text-2xl flex-shrink-0 self-start mr-2">🌙</span>
                                    <span class="font-bold text-teal-800 flex-shrink-0 self-start mt-0.5 md:mt-1">住宿：</span>
                                    <div class="flex-1 flex items-center justify-between gap-3 ml-1">
                                        <span class="font-bold mt-0.5 md:mt-1">
                                            ${day.hotel.link 
                                                ? `<a href="${day.hotel.link}" target="_blank" class="text-blue-800 underline hover:text-blue-600 transition-colors">${day.hotel.name}</a>` 
                                                : day.hotel.name}
                                        </span>
                                        ${day.hotel.image ? `<img src="${day.hotel.image}" onerror="this.style.display='none'" alt="${day.hotel.name}" class="w-16 h-16 md:w-24 md:h-24 flex-shrink-0 object-cover rounded-lg border border-slate-200 shadow-sm" />` : ''}
                                    </div>
                                </div>
                                <div class="flex items-start text-slate-600 bg-orange-50 p-3 md:p-4 rounded-xl">
                                    <span class="text-xl md:text-2xl flex-shrink-0 mr-2">🍱</span>
                                    <span class="font-bold text-orange-800 flex-shrink-0 mt-0.5 md:mt-1">餐食：</span>
                                    <span class="ml-1 font-bold mt-0.5 md:mt-1">早:${day.meals.breakfast} / 午:${day.meals.lunch} / 晚:${day.meals.dinner}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('')}
            </div>`;
        }

        // --- 全新渲染的雙欄位配房表 ---
        function renderRooms() {
            const mid = Math.ceil(roomData.length / 2);
            const leftCol = roomData.slice(0, 13);
            const rightCol = roomData.slice(13);

            const renderTable = (data) => `
                <table class="w-full text-sm md:text-base text-left">
                    <thead class="bg-teal-50 text-teal-800 font-bold border-b-2 border-teal-200">
                        <tr>
                            <th class="px-4 py-3 whitespace-nowrap w-16 text-center">編號</th>
                            <th class="px-4 py-3 whitespace-nowrap">房型</th>
                            <th class="px-4 py-3 whitespace-nowrap">姓名</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        ${data.map(room => `
                            <tr class="hover:bg-slate-50 transition-colors">
                                <td class="px-4 py-3 font-bold text-slate-500 text-center text-lg">${room.id}</td>
                                <td class="px-4 py-3 font-bold text-slate-800">${room.type}</td>
                                <td class="px-4 py-3 font-medium text-slate-700">
                                    <div class="flex flex-col space-y-1">
                                        ${room.names.map(name => `<span>${name}</span>`).join('')}
                                    </div>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            return `
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 md:p-6">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div class="overflow-hidden border border-slate-200 rounded-xl shadow-sm">
                        ${renderTable(leftCol)}
                    </div>
                    <div class="overflow-hidden border border-slate-200 rounded-xl shadow-sm">
                        ${renderTable(rightCol)}
                    </div>
                </div>
            </div>`;
        }

        function renderVehicles() {
            return `<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                ${vehicleData.map(car => `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-4 border-t-4 border-t-amber-400 hover:shadow-md transition-shadow">
                        <div class="flex items-center space-x-2 mb-3 border-b border-slate-100 pb-2">
                            <span class="text-xl">🚐</span>
                            <h3 class="font-bold text-base md:text-lg text-slate-800">${car.car}</h3>
                        </div>
                        <ul class="space-y-1.5">
                            ${car.members.map(member => `
                                <li class="flex items-center text-slate-700 bg-slate-50 px-3 py-1.5 rounded-md text-sm md:text-base font-bold">
                                    <div class="w-1.5 h-1.5 bg-amber-400 rounded-full mr-2"></div>
                                    ${member}
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                `).join('')}
            </div>`;
        }

        function renderGiraffes() {
            return `<div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                ${giraffeData.map(slot => `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden text-center">
                        <div class="bg-green-600 py-3 text-white">
                            <h3 class="font-bold flex items-center justify-center text-base md:text-lg">
                                <span class="mr-2 text-lg">⏰</span>
                                ${slot.time} (${slot.members.length}人)
                            </h3>
                        </div>
                        <div class="p-4 bg-green-50/30">
                            <div class="grid grid-cols-2 gap-2">
                                ${slot.members.map(member => `
                                    <div class="bg-white border border-green-100 py-2 px-1 rounded-lg shadow-sm text-slate-700 text-sm font-bold">
                                        ${member}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `).join('')}
            </div>`;
        }

        function renderThaiDress() {
            return `<div class="space-y-6">
                ${thaiDressData.map(data => `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="bg-indigo-600 py-3 px-4 text-white">
                            <h3 class="font-bold text-base md:text-lg flex items-center">
                                <span class="mr-2 text-xl">👑</span>
                                店家：${data.shop}
                            </h3>
                        </div>
                        <div class="p-4 md:p-5">
                            <h4 class="font-bold text-indigo-800 border-b-2 border-indigo-100 pb-1 mb-4 inline-block text-sm md:text-base">攝影分組</h4>
                            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 mb-6">
                                ${data.photoGroups.map((group, i) => `
                                    <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-3 md:p-4">
                                        <div class="text-xs text-indigo-500 font-bold mb-2 uppercase">Group ${i + 1}</div>
                                        ${group.map(name => `<div class="text-slate-800 font-bold text-sm ml-1 mb-1">${name}</div>`).join('')}
                                    </div>
                                `).join('')}
                            </div>
                            
                            ${data.makeupOnly.length > 0 ? `
                                <h4 class="font-bold text-pink-600 border-b-2 border-pink-100 pb-1 mb-4 inline-block text-sm md:text-base">僅化妝</h4>
                                <div class="flex flex-wrap gap-3">
                                    ${data.makeupOnly.map(name => `
                                        <span class="bg-pink-50 border border-pink-200 text-pink-800 px-4 py-1.5 rounded-full text-sm font-bold">
                                            ${name}
                                        </span>
                                    `).join('')}
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `).join('')}
            </div>`;
        }

        function renderContent() {
            const contentDiv = document.getElementById('app-content');
            switch(activeTab) {
                case 'itinerary': contentDiv.innerHTML = renderItinerary(); break;
                case 'rooms': contentDiv.innerHTML = renderRooms(); break;
                case 'vehicles': contentDiv.innerHTML = renderVehicles(); break;
                case 'giraffes': contentDiv.innerHTML = renderGiraffes(); break;
                case 'thaidress': contentDiv.innerHTML = renderThaiDress(); break;
            }
        }

        // --- 網頁載入後執行 ---
        document.addEventListener("DOMContentLoaded", () => {
            renderFlights();
            fetchWeatherData(); // 即時載入天氣資料
            renderTabs();
            renderContent();
        });

    </script>
</body>
</html>
